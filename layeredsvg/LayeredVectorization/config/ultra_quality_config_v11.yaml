# Ultra Quality SDXL Vectorization Config (1024x1024)
# Higher quality output with more paths and detail
# For use with app3.py only

simp_img_seq_indexs: [80, 60, 40, 20, 0]
is_save_all_simp_img_seq: True
is_save_masks: True
multiple: 1

# Lower epsilon = more detailed path curves
approxpolydp_epsilon: 2.5

color_fitting_type: "dominan" # "dominan" or "mse"

# More visual refinement iterations
add_visual_path_num_iters: 10

# More paths for higher detail
max_path_num_limit: 768

paths_merge_color_threshold: 0.1
paths_merge_distance_threshold: 3
paths_remove_visual_threshold: 7.0

# Perform kmeans clustering on target images to reduce color categories
is_cluster_target_img: True
# More color clusters for richer palette
kmeas_k: 150

sam:
  sam_checkpoint: "checkpoints/sam_vit_h_4b8939.pth"
  model_type: "vit_h"
  # SDXL-optimized SAM settings (1024x1024)
  points_per_side: 36  # Slightly more for detail
  pred_iou_thresh: 0.86
  stability_score_thresh: 0.85
  crop_n_layers: 1
  crop_n_points_downscale_factor: 2
  min_mask_region_area: 80  # Allow slightly smaller regions
  box_nms_thresh: 0.7

# Per-layer SAM for internal structure detection (ULTRA QUALITY)
# Very sensitive settings for internal details
sam_internal:
  sam_checkpoint: "checkpoints/sam_vit_h_4b8939.pth"
  model_type: "vit_h"
  points_per_side: 60  # More sampling points than fast
  pred_iou_thresh: 0.77  # More permissive than fast (0.78)
  stability_score_thresh: 0.75
  crop_n_layers: 1
  crop_n_points_downscale_factor: 1
  min_mask_region_area: 18  # Smaller than fast (20)
  box_nms_thresh: 0.52

train:
  is_train_stroke: False
  is_train_visual_color: True
  is_train_struct_color: True
  # Higher optimization iterations
  struct_opt_num_iters: 150
  visual_opt_num_iters: 250

# Bezier Splatting parameters (for v4 pipeline)
# ULTRA QUALITY: 768 curves, 7000 iterations
bs:
  bezier_degree: 4
  num_samples: 64
  iterations: 7000
  mode: "closed"
  lr: 0.01
  min_curves: 768           # Match max_path_num_limit

# COVec parameters (for v6 pipeline - Clair Obscur / Illumination-Aware)
# HIGH QUALITY: 768 paths, more iterations
covec:
  warmup_epochs: 80         # More epochs for 768 paths
  joint_epochs: 80
  max_path_rounds: 5        # Paper: 5 rounds
  refine_iters: 130

base_lr:
  point: 1
  color: 0.01
  stroke_width: 0.1
  stroke_color: 0.01
